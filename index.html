<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AniStream</title>
<style>
:root{--bg:#0f1117;--card:#181b24;--text:#e8e9ee;--mute:#9096a8;--accent:#ff4d6d}
@media (prefers-color-scheme:light){:root{--bg:#f5f6fa;--card:#fff;--text:#1a1c24;--mute:#6a7084}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--card);box-shadow:0 1px 8px #0004}
header h1{font-size:20px;color:var(--accent);cursor:pointer;white-space:nowrap}
header input{flex:1;min-width:0;padding:9px 14px;border-radius:20px;border:1px solid #8884;background:var(--bg);color:var(--text)}
button{cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:#fff;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{margin:8px 0 14px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#8883}
.card p{padding:8px;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info{display:flex;gap:18px;flex-wrap:wrap}
.info img{width:200px;max-width:100%;border-radius:10px}
.info div{flex:1;min-width:240px}
.desc{color:var(--mute);font-size:14px;line-height:1.5;margin:10px 0;max-height:160px;overflow:auto}
.eps{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.eps button{background:var(--card);color:var(--text);border:1px solid #8884;min-width:48px}
.eps button.on{background:var(--accent);color:#fff}
video{width:100%;max-height:70vh;background:#000;border-radius:10px;margin-top:14px}
.msg{color:var(--mute);padding:30px;text-align:center}
.cfg{margin-top:30px;font-size:12px;color:var(--mute)}
.cfg input{width:100%;max-width:360px;padding:6px;background:var(--card);color:var(--text);border:1px solid #8884;border-radius:6px}
</style>
</head>
<body>
<header>
  <h1 onclick="location.hash=''">▶ AniStream</h1>
  <input id="q" placeholder="Tìm anime..." enterkeyhint="search">
  <button id="go">Tìm</button>
</header>
<main id="app"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
const DEFAULT_API = "https://api.amvstr.me/api/v2";
let API = DEFAULT_API;
try { API = localStorage.getItem("api") || DEFAULT_API; } catch(e){}
const app = document.getElementById("app");
const $q = document.getElementById("q");
let hls = null;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const title = t => t ? (t.english || t.romaji || t.userPreferred || t.native || "?") : "?";

async function get(path){
  const r = await fetch(API + path);
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function loading(){ app.innerHTML = '<div class="msg">Đang tải...</div>'; }
function fail(e){
  app.innerHTML = `<div class="msg">Lỗi: ${esc(e.message)}<br>API có thể đã ngừng hoạt động hoặc bị chặn CORS. Đổi API ở cuối trang.</div>` + cfg();
}
function cfg(){
  return `<div class="cfg">API URL: <input id="api" value="${esc(API)}"> <button onclick="saveApi()">Lưu</button></div>`;
}
function saveApi(){
  API = document.getElementById("api").value.trim().replace(/\/$/,"") || DEFAULT_API;
  try { localStorage.setItem("api", API); } catch(e){}
  route();
}
function grid(list){
  if(!list.length) return '<div class="msg">Không có kết quả.</div>';
  return '<div class="grid">' + list.map(a => `
    <div class="card" onclick="location.hash='#anime-${a.id}'">
      <img loading="lazy" src="${esc(a.coverImage?.large || a.coverImage?.extraLarge)}" alt="">
      <p>${esc(title(a.title))}</p>
    </div>`).join("") + "</div>";
}

async function home(){
  loading();
  try{
    const d = await get("/trending");
    app.innerHTML = "<h2>🔥 Đang thịnh hành</h2>" + grid(d.results || []) + cfg();
  }catch(e){ fail(e); }
}
async function search(kw){
  loading();
  try{
    const d = await get(`/search?q=${encodeURIComponent(kw)}&p=1&limit=24`);
    app.innerHTML = `<h2>Kết quả cho “${esc(kw)}”</h2>` + grid(d.results || []);
  }catch(e){ fail(e); }
}
async function detail(id){
  loading();
  try{
    const [info, ep] = await Promise.all([get(`/info/${id}`), get(`/episode/${id}`)]);
    const eps = ep.episodes || [];
    app.innerHTML = `
      <div class="info">
        <img src="${esc(info.coverImage?.large)}" alt="">
        <div>
          <h2>${esc(title(info.title))}</h2>
          <small>${esc((info.genres||[]).join(" · "))} ${info.episodes ? "· " + info.episodes + " tập" : ""}</small>
          <div class="desc">${info.description || ""}</div>
        </div>
      </div>
      <h2>Danh sách tập</h2>
      <div class="eps" id="eps">${
        eps.length ? eps.map((e,i)=>`<button data-i="${i}">${esc(e.number ?? i+1)}</button>`).join("")
                   : '<span class="msg">Chưa có tập nào.</span>'}</div>
      <div id="player"></div>`;
    document.getElementById("eps").onclick = ev => {
      const b = ev.target.closest("button"); if(!b) return;
      document.querySelectorAll("#eps button").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      play(eps[+b.dataset.i]);
    };
    if(eps.length) document.querySelector("#eps button").click();
  }catch(e){ fail(e); }
}
async function play(ep){
  const box = document.getElementById("player");
  box.innerHTML = '<div class="msg">Đang lấy luồng phát...</div>';
  try{
    const d = await get(`/stream/${ep.id}`);
    const url = d.stream?.multi?.main?.url || d.stream?.multi?.backup?.url || d.stream?.sources?.[0]?.url;
    if(!url) throw new Error("Không tìm thấy nguồn phát");
    box.innerHTML = '<video id="v" controls autoplay playsinline></video>';
    const v = document.getElementById("v");
    if(hls){ hls.destroy(); hls = null; }
    if(window.Hls && Hls.isSupported()){
      hls = new Hls(); hls.loadSource(url); hls.attachMedia(v);
    } else v.src = url;   // Safari hỗ trợ HLS gốc
  }catch(e){ box.innerHTML = `<div class="msg">Lỗi phát: ${esc(e.message)}</div>`; }
}

function route(){
  const h = location.hash.slice(1);
  if(hls){ hls.destroy(); hls = null; }
  if(h.startsWith("anime-")) detail(h.slice(6));
  else if(h.startsWith("search-")) search(decodeURIComponent(h.slice(7)));
  else home();
}
function doSearch(){ const k = $q.value.trim(); if(k) location.hash = "#search-" + encodeURIComponent(k); }
document.getElementById("go").onclick = doSearch;
$q.onkeydown = e => { if(e.key === "Enter") doSearch(); };
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
